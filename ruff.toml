[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (Google uses sorted imports)
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"   # This is the key one — enforces Google docstring style

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
